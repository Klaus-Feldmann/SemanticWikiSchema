name: SemanticWikiSchema candidate checks
on:
  push:
    branches: [master, "publication/sws-0.5.0*"]
  pull_request:
    branches: [master, "publication/sws-0.5.0*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  standalone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, pcntl
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: First-installation helper checks
        run: |
          python3 installer/tests/test_install.py
          python3 -m unittest discover -s scripts/tests -v
          python3 installer/tests/composer_first_install.py
      - name: Install isolated PHP test dependencies
        run: composer install --working-dir=publication-tests/dependencies --no-interaction --prefer-dist
      - name: PHP standalone checks
        env:
          SWS_TEST_VENDOR: ${{ github.workspace }}/publication-tests/dependencies/vendor/autoload.php
        run: |
          publication-tests/dependencies/vendor/bin/phpunit -c publication-tests/phpunit.xml
          publication-tests/dependencies/vendor/bin/phpunit -c publication-tests/phpunit.xml tests/phpunit/Application/Actions/CreateSubjectActionTest.php
          publication-tests/dependencies/vendor/bin/phpunit -c publication-tests/phpunit.xml tests/phpunit/Application/Actions/ReplaceSubjectActionTest.php
          for script in publication-tests/*-contract.php; do php "$script"; done
      - name: Data UI checks
        working-directory: resources/ext.sws
        run: |
          npm ci --ignore-scripts
          npm test -- --run --maxWorkers=4
          npx vue-tsc -b
          npm run build
      - name: Graph checks
        working-directory: graph-explorer-dev
        run: |
          npm ci --ignore-scripts
          npm test
          npm run build
          node tests/compare-build.mjs
          node tests/dom-integration.mjs
          node tests/fields-dom.mjs
      - name: Lua checks
        working-directory: integrations/smw/tests
        run: |
          npm install --ignore-scripts
          npm test
      - name: Verify release archives
        run: python3 scripts/build_release.py --output "${{ runner.temp }}/sws-release"
