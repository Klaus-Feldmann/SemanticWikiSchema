name: Publish SWS 0.7.0.2

on:
  push:
    branches: ['release/0.7.0.2']

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build and verify release packages
        run: python3 scripts/build_release.py --output "$RUNNER_TEMP/sws-release"
      - name: Publish beta release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.7.0.2 \
            "$RUNNER_TEMP/sws-release"/SemanticWikiSchema-0.7.0.2-source.zip \
            "$RUNNER_TEMP/sws-release"/SemanticWikiSchema-0.7.0.2-installer.zip \
            "$RUNNER_TEMP/sws-release"/SemanticWikiSchema-0.7.0.2-upgrade.zip \
            "$RUNNER_TEMP/sws-release"/SHA256SUMS \
            --target "$GITHUB_SHA" --prerelease \
            --title "Semantic WikiSchema 0.7.0.2" --notes-file RELEASE-NOTES.md
