# Example fragment for the existing HTTPS VirtualHost. Adapt /path/to/mediawiki and /w.
# mod_alias, mod_rewrite, mod_proxy and mod_proxy_http are needed.
RewriteEngine On
Alias "/graph-explorer/" "/path/to/mediawiki/extensions/SemanticWikiSchema/graph-explorer/"
<Directory "/path/to/mediawiki/extensions/SemanticWikiSchema/graph-explorer">
    Options -Indexes +FollowSymLinks -MultiViews
    AllowOverride None
    DirectoryIndex envendpoint.html
    Require local
</Directory>
<LocationMatch "^/graph-explorer/sparql$">
    <RequireAll>
        Require local
        Require method GET
    </RequireAll>
</LocationMatch>
# Grant the intended client addresses deliberately; the SPARQL endpoint bypasses wiki page permissions.
RewriteRule ^/?graph-explorer/sparql$ http://127.0.0.1:3331/sws/query [P,L]
RewriteRule ^/?entity/(E[1-9][0-9]*|s[A-Za-z0-9]{14})$ /w/rest.php/sws/v0/entity/$1 [R=302,L]
RewriteRule ^/?schema-id/(S[1-9][0-9]*)$ /w/rest.php/sws/v0/schema-id-iri/$1 [R=302,L]
RewriteRule ^/?schema/([^/]+)$ /wiki/Schema:$1 [R=302,L]
